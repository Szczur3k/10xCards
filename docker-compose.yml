services:
  fiszki-postgres:
    container_name: fiszki-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports:
      - "${HOST_POSTGRES_PORT:-54332}:5432"
    volumes:
      - supabase_db:/var/lib/postgresql/data
      - ./docker/postgres/docker-init-migrations.sh:/docker-entrypoint-initdb.d/00-migrations.sh:ro
      - ./supabase/migrations:/migrations:ro
      - ./supabase/seed-simple.sql:/docker-entrypoint-initdb.d/99-seed.sql:ro
    networks:
      - fiszki-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  fiszki-rest:
    container_name: fiszki-rest
    image: postgrest/postgrest:v12.2.2
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@fiszki-postgres:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_SERVER_PORT: 3000
    expose:
      - "3000"
    depends_on:
      fiszki-postgres:
        condition: service_healthy
    networks:
      - fiszki-net
    restart: unless-stopped

  fiszki-gateway:
    container_name: fiszki-gateway
    image: nginx:1.27-alpine
    volumes:
      - ./docker/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "8000"
    depends_on:
      - fiszki-rest
    networks:
      - fiszki-net
    restart: unless-stopped

  fiszki-web:
    container_name: fiszki-web
    build: .
    ports:
      - "${HOST_APP_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      # Bez tego Astro nasłuchuje na 127.0.0.1 — host/Tunnel/nginx nie trafiają (502).
      HOST: ${HOST:-0.0.0.0}
      PORT: 3001
      SUPABASE_URL: ${SUPABASE_URL:-http://fiszki-gateway:8000}
      SUPABASE_KEY: ${SUPABASE_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      MOCK_AUTH: ${MOCK_AUTH:-true}
      MOCK_USER_ID: ${MOCK_USER_ID:-00000000-0000-4000-8000-000000000001}
      MOCK_USER_EMAIL: ${MOCK_USER_EMAIL:-test@10xdevs.pl}
    depends_on:
      - fiszki-gateway
    restart: unless-stopped
    networks:
      - fiszki-net

volumes:
  supabase_db:

networks:
  fiszki-net:
    name: fiszki-net
    driver: bridge
