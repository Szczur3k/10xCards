services:
  fiszki-postgres:
    container_name: fiszki-postgres
    image: supabase/postgres:17.6.1.106
    environment:
      # Hasło tylko przy pierwszym utworzeniu volume — zmiana bez rm volume = rozjazd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports:
      - "${HOST_POSTGRES_PORT:-54332}:5432"
    volumes:
      - supabase_db:/var/lib/postgresql/data
      # Migracje aplikacji NIE w initdb — wymagają auth.users (GoTrue). Patrz fiszki-migrate.
    networks:
      - fiszki-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  fiszki-auth:
    container_name: fiszki-auth
    image: supabase/gotrue:v2.158.1
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_API_EXTERNAL_URL: ${GOTRUE_API_EXTERNAL_URL:-http://fiszki-gateway:8000}
      API_EXTERNAL_URL: ${GOTRUE_API_EXTERNAL_URL:-http://fiszki-gateway:8000}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@fiszki-postgres:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3001}
      GOTRUE_URI_ALLOW_LIST: ${URI_ALLOW_LIST:-http://localhost:3001}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
    expose:
      - "9999"
    depends_on:
      fiszki-postgres:
        condition: service_healthy
    networks:
      - fiszki-net
    restart: unless-stopped

  # Jednorazowo po stracie GoTrue: czeka na auth.users, odpala SQL z supabase/migrations + seed
  fiszki-migrate:
    container_name: fiszki-migrate
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGHOST: fiszki-postgres
      PGUSER: postgres
      PGDATABASE: postgres
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./supabase/seed-simple.sql:/seed.sql:ro
      - ./docker/postgres/run-app-migrations.sh:/run.sh:ro
    networks:
      - fiszki-net
    depends_on:
      fiszki-postgres:
        condition: service_healthy
      fiszki-auth:
        condition: service_started
    entrypoint: ["/bin/sh", "/run.sh"]

  fiszki-rest:
    container_name: fiszki-rest
    image: postgrest/postgrest:v12.2.2
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@fiszki-postgres:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_SERVER_PORT: 3000
    expose:
      - "3000"
    depends_on:
      fiszki-postgres:
        condition: service_healthy
      fiszki-migrate:
        condition: service_completed_successfully
    networks:
      - fiszki-net
    restart: unless-stopped

  fiszki-gateway:
    container_name: fiszki-gateway
    image: nginx:1.27-alpine
    volumes:
      - ./docker/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "8000"
    depends_on:
      - fiszki-auth
      - fiszki-rest
    networks:
      - fiszki-net
    restart: unless-stopped

  fiszki-web:
    container_name: fiszki-web
    build: .
    ports:
      - "${HOST_APP_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      SUPABASE_URL: ${SUPABASE_URL:-http://fiszki-gateway:8000}
      SUPABASE_KEY: ${SUPABASE_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      MOCK_AUTH: ${MOCK_AUTH:-false}
    depends_on:
      - fiszki-gateway
    restart: unless-stopped
    networks:
      - fiszki-net

volumes:
  supabase_db:

networks:
  fiszki-net:
    name: fiszki-net
    driver: bridge
